name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # macOS runner required: the whole tool is hdiutil, sips, iconutil and osascript
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash version
        run: bash --version | head -1

      - name: shellcheck
        run: |
          brew install shellcheck
          shellcheck --severity=warning make-a-dmg test.sh

      - name: smoke tests
        # test.sh deliberately skips Finder window styling, which needs a desktop
        # session and would false-fail on a headless runner
        run: ./test.sh
