name: test

# Documentation cannot break the tool, and the suite builds eight real disk
# images, so prose-only pushes skip it. Anything that can affect behaviour --
# the script, the tests, the workflows themselves -- still runs everything.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'assets/**', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'assets/**', 'docs/**', 'LICENSE']
  workflow_dispatch:

jobs:
  # Static analysis needs no macOS, and running it on Linux avoids installing
  # anything through Homebrew on the macOS image.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck --severity=warning make-a-dmg test.sh

  test:
    # macOS runner required: the whole tool is hdiutil, sips, iconutil and osascript
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: bash version
        run: bash --version | head -1

      - name: smoke tests
        # --full: every check, including the build-heavy ones a local run skips.
        # Finder window styling is never checked here — it needs a desktop
        # session and would false-fail on a headless runner.
        run: ./test.sh --full
